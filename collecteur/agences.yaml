    commune: Arlon
    url: https://www.trevi.be
    logiciel: generique
    actif: true
    note: "Site national trevi.be : recherche par codes postaux (le site ajoute un rayon autour de chaque localité) ; les biens hors province sont écartés à l'intégration"
    options:
      liste_location: "https://www.trevi.be/fr/louer-bien-immobilier?purpose=1&zips[]=6700_ARLON&zips[]=6600_BASTOGNE&zips[]=6800_LIBRAMONT-CHEVIGNY&zips[]=6840_NEUFCHATEAU&zips[]=6900_MARCHE-EN-FAMENNE&zips[]=6760_VIRTON&zips[]=6780_MESSANCY&zips[]=6790_AUBANGE&zips[]=6830_BOUILLON&zips[]=6690_VIELSALM&zips[]=6660_HOUFFALIZE&zips[]=6940_DURBUY&zips[]=6820_FLORENVILLE&zips[]=6870_SAINT-HUBERT&zips[]=6880_BERTRIX&zips[]=6980_LA-ROCHE-EN-ARDENNE"
      liste_achat: "https://www.trevi.be/fr/acheter-bien-immobilier?purpose=0&zips[]=6700_ARLON&zips[]=6600_BASTOGNE&zips[]=6800_LIBRAMONT-CHEVIGNY&zips[]=6840_NEUFCHATEAU&zips[]=6900_MARCHE-EN-FAMENNE&zips[]=6760_VIRTON&zips[]=6780_MESSANCY&zips[]=6790_AUBANGE&zips[]=6830_BOUILLON&zips[]=6690_VIELSALM&zips[]=6660_HOUFFALIZE&zips[]=6940_DURBUY&zips[]=6820_FLORENVILLE&zips[]=6870_SAINT-HUBERT&zips[]=6880_BERTRIX&zips[]=6980_LA-ROCHE-EN-ARDENNE"
      carte: ".w-card-estate"
      lien: "a.w-card-estate__body"
      titre: ".w-card-estate__category_town"
      prix: ".w-card-estate__price"
      lieu: ".w-card-estate__category_town div:nth-of-type(3)"
      type: ".w-card-estate__category_town div:nth-of-type(2)"
