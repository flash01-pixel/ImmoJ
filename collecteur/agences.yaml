# Agences immobilières de la province de Luxembourg.
#
# Chaque entrée :
#   nom        : nom de l'agence (affiché dans l'appli)
#   commune    : commune principale
#   url        : site officiel (vide si inconnu)
#   logiciel   : module de collecte (dossier immoj/sources/agences/) :
#                whise        site « modèle Whise » (/fr/7/chercher-bien/a-louer)
#                omnicasa     site Omnicasa (/fr/a-louer)
#                generique    site maison : sélecteurs CSS dans « options »
#                inconnu      pas encore analysé / pas géré
#   actif      : false = ignorée (pas de site, publie seulement sur les portails,
#                logiciel pas encore géré). Les portails couvrent alors l'agence.
#   note       : pourquoi inactive, ou remarque utile
#   options    : paramètres propres au module (urls des listes, sélecteurs...)
#   telephone  : optionnel, affiché dans l'appli si l'annonce ne le donne pas
#
# Pour ajouter une agence : copier un bloc, adapter, pousser. Rien d'autre.
# Pour vérifier un site : pousser ce fichier sur une branche de travail déclenche
# le workflow « Analyser les agences » (rapport dans le journal).
#
# État au 21/10/2026 : analyse automatique faite (outils/analyser_agences.py).
