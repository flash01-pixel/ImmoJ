# Agences immobilières de la province de Luxembourg.
#
# Chaque entrée :
#   nom        : nom de l'agence (affiché dans l'appli)
#   commune    : commune principale
#   url        : site officiel (vide si inconnu)
#   logiciel   : module de collecte (dossier immoj/sources/agences/) :
#                whise        site « modèle Whise » (/fr/7/chercher-bien/a-louer)
#                omnicasa     site Omnicasa (/fr/a-louer)
#                generique    site maison : sélecteurs CSS dans « options »
#                inconnu      pas encore analysé / pas géré
#   actif      : false = ignorée (pas de site, publie seulement sur les portails,
#                logiciel pas encore géré). Les portails couvrent alors l'agence.
#   note       : pourquoi inactive, ou remarque utile
#   options    : paramètres propres au module (urls des listes, sélecteurs...)
#   telephone  : optionnel, affiché dans l'appli si l'annonce ne le donne pas
#
# Pour ajouter une agence : copier un bloc, adapter, pousser. Rien d'autre.
# Pour vérifier un site : pousser ce fichier sur une branche de travail déclenche
# le workflow « Analyser les agences » (rapport dans le journal).
#
# État au 21/10/2026 : analyse automatique faite (outils/analyser_agences.py).
agences:
  # --- Réseaux ---
  - nom: Honesty
    commune: Arlon
    url: https://www.honesty.be
    logiciel: whise_webulous
    actif: true
    note: "Réseau (Arlon, Virton, Libramont, Bertrix, Marche, Rochefort...). WordPress + extension Whise/Webulous : la liste arrive par ajax (JSON) ; les biens hors province sont écartés à l'intégration"
  - nom: ERA B-Lux
    commune: Marche-en-Famenne
    url: https://www.era.be
    logiciel: era
    actif: true
    note: "Bastogne, Marche, Libramont. Site national era.be : API JSON filtrée sur les communes de la province (toutes les agences ERA y publiant)"
  - {nom: Vos Agences, commune: Marche-en-Famenne, url: https://vosagences.be, logiciel: inconnu, actif: false,
     note: "Condrogest (Marche) et Ardenne (Libramont). WordPress + SweepBright ; liste : /fr/a-louer/"}
  - nom: Home Sweet Gaume
    commune: Virton
    url: https://homesweetgaume.be
    logiciel: wordpress
    actif: true
    note: "Virton et Florenville. WordPress : type de contenu « bien » (API REST), prix et détails lus sur la fiche"
    options:
      type_contenu: bien
      classes: {type: bien_type, lieu: ville}
      detail:
        prix: ".et_pb_text_inner"
        chambres: "label:Nombre de chambres"
        surface: "label:Superficie"
  - {nom: Century 21 Cofilux, commune: Arlon, url: https://www.century21.be, logiciel: inconnu, actif: false,
     note: "Site national century21.be (/fr/a-louer) : filtrer sur l'agence"}
