# Collecte horaire des annonces.
#
# Le cron de GitHub est en UTC. « 0 5-22 » couvre 7h–23h de Bruxelles été
# (UTC+2) comme hiver (UTC+1) ; le collecteur vérifie lui-même l'heure locale
# et s'arrête immédiatement en dehors de 7h–23h (coût : ~20 s).
#
# Quota (dépôt privé) : ~17 exécutions/jour × 30 jours ≈ 510 par mois. Avec
# un timeout de 5 minutes on reste sous les 2 000 minutes gratuites.
name: Collecte des annonces

on:
  schedule:
    - cron: "0 5-22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Limiter à une source (vide = toutes)"
        required: false
        default: ""
      pages:
        description: "Pages de résultats par source (vide = défaut)"
        required: false
        default: ""

# Une seule collecte à la fois : si la précédente dure encore, la nouvelle attend.
concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: collecteur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collecteur/requirements.txt
      - run: pip install -r requirements.txt

      # Zéro configuration : avec le seul secret SUPABASE_ACCESS_TOKEN, l'URL, la
      # clé service et le topic ntfy sont retrouvés automatiquement.
      - name: Résoudre les accès Supabase
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python outils/supabase_admin.py env

      - name: Lancer le collecteur
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC: ${{ env.NTFY_TOPIC || secrets.NTFY_TOPIC }}
          GMAIL_UTILISATEUR: ${{ secrets.GMAIL_UTILISATEUR }}
          GMAIL_MOT_DE_PASSE: ${{ secrets.GMAIL_MOT_DE_PASSE }}
          SOURCE: ${{ inputs.source }}
          PAGES: ${{ inputs.pages }}
        run: |
          # Tant que les secrets ne sont pas configurés, on s'arrête sans erreur
          # (sinon GitHub enverrait un e-mail d'échec à chaque heure).
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase non configuré : rien à faire (voir docs/00-demarrage-rapide.md)."
            exit 0
          fi
          ARGS=""
          if [ -n "$SOURCE" ]; then ARGS="$ARGS --source $SOURCE"; fi
          if [ -n "$PAGES" ]; then ARGS="$ARGS --pages $PAGES"; fi
          # Un lancement manuel ignore la plage horaire.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --forcer"; fi
          python -m immoj.main $ARGS
