# Collecte horaire des annonces.
#
# Le cron de GitHub est en UTC. « 0 5-22 » couvre 7h–23h de Bruxelles été
# (UTC+2) comme hiver (UTC+1) ; le collecteur vérifie lui-même l'heure locale
# et s'arrête immédiatement en dehors de 7h–23h (coût : ~20 s).
#
# Quota (dépôt privé) : ~17 exécutions/jour × 30 jours ≈ 510 par mois. Une
# exécution dure 2 à 5 minutes (portails toutes les heures, agences une heure
# sur deux, temps des fiches plafonné par BUDGET_FICHES_S, délais de politesse
# comptés site par site) ; seule une première collecte après l'ajout de
# nombreuses sources dépasse 10 minutes. Le timeout de 15 minutes n'est qu'une
# sécurité.
#
# Deux stockages, cumulables :
#  * fichier JSON sur la branche « donnees » du dépôt (toujours) : lu par l'appli
#    en mode « sans compte » ;
#  * Supabase, si SUPABASE_ACCESS_TOKEN (ou SUPABASE_URL + SUPABASE_SERVICE_KEY) existe.
name: Collecte des annonces

permissions:
  contents: write

on:
  schedule:
    - cron: "0 5-22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Limiter à une source (vide = toutes)"
        required: false
        default: ""
      pages:
        description: "Pages de résultats par source (vide = défaut)"
        required: false
        default: ""

# Une seule collecte à la fois : si la précédente dure encore, la nouvelle attend.
concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: collecteur
    env:
      # Le contexte « secrets » n'est pas utilisable dans un « if » : on passe par env.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collecteur/requirements.txt
      - run: pip install -r requirements.txt

      # Base JSON précédente (branche « donnees »), s'il y en a une.
      - name: Récupérer la base JSON
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p donnees
          if git fetch --depth=1 origin donnees 2>/dev/null; then
            git show origin/donnees:base.json > donnees/base.json || true
            echo "Base JSON récupérée ($(wc -c < donnees/base.json) octets)."
          else
            echo "Pas encore de branche donnees : première collecte."
          fi

      # Zéro configuration : avec le seul secret SUPABASE_ACCESS_TOKEN, l'URL, la
      # clé service et le topic ntfy sont retrouvés automatiquement.
      - name: Résoudre les accès Supabase
        if: env.SUPABASE_ACCESS_TOKEN != ''
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python outils/supabase_admin.py env

      - name: Lancer le collecteur
        env:
          # Secrets explicites (voie manuelle) ; les valeurs résolues par le jeton,
          # écrites dans GITHUB_ENV à l'étape précédente, sont déjà dans l'environnement.
          SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NTFY_TOPIC_SECRET: ${{ secrets.NTFY_TOPIC }}
          GMAIL_UTILISATEUR: ${{ secrets.GMAIL_UTILISATEUR }}
          GMAIL_MOT_DE_PASSE: ${{ secrets.GMAIL_MOT_DE_PASSE }}
          SOURCE: ${{ inputs.source }}
          PAGES: ${{ inputs.pages }}
        run: |
          export SUPABASE_URL="${SUPABASE_URL:-$SUPABASE_URL_SECRET}"
          export SUPABASE_SERVICE_KEY="${SUPABASE_SERVICE_KEY:-$SUPABASE_SERVICE_KEY_SECRET}"
          export NTFY_TOPIC="${NTFY_TOPIC:-$NTFY_TOPIC_SECRET}"
          # Tant que Supabase n'est pas configuré, on s'arrête sans erreur
          # (sinon GitHub enverrait un e-mail d'échec à chaque heure).
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase non configuré : stockage JSON seulement (mode sans compte)."
          fi
          ARGS="--fichier ../donnees/base.json"
          if [ -n "$SOURCE" ]; then ARGS="$ARGS --source $SOURCE"; fi
          if [ -n "$PAGES" ]; then ARGS="$ARGS --pages $PAGES"; fi
          # Un lancement manuel ignore la plage horaire.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="$ARGS --forcer"; fi
          python -m immoj.main $ARGS

      # Publie base.json + annonces.json sur la branche « donnees » (un seul
      # commit, écrasé à chaque fois : le dépôt ne grossit pas).
      - name: Publier la base JSON
        working-directory: ${{ github.workspace }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          if [ ! -s donnees/annonces.json ]; then echo "Pas d'export à publier."; exit 0; fi
          rm -rf /tmp/branche-donnees && mkdir /tmp/branche-donnees && cd /tmp/branche-donnees
          git init -q -b donnees
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/donnees/base.json" "$GITHUB_WORKSPACE/donnees/annonces.json" .
          printf '# Données ImmoJ\n\nMis à jour par le workflow de collecte. `annonces.json` est lu par l application.\n' > README.md
          git add . && git commit -q -m "Collecte du $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:donnees
          echo "Branche donnees mise à jour."
