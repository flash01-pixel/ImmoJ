# Compilation de l'APK Android par GitHub Actions (aucune installation sur ton PC).
#
# Déclenché à chaque modification du dossier android/, ou à la main.
# L'APK (debug, signé avec une clé de développement) est disponible :
#  * dans l'onglet Actions → l'exécution → « Artifacts » → ImmoJ-apk ;
#  * et, pour un tag « v* », dans l'onglet « Releases ».
# Installation : voir docs/04-installer-apk.md.
name: Compiler l'APK

on:
  push:
    # « branches » est obligatoire dès qu'on filtre sur « tags », sinon les
    # pushs de branches ne déclenchent plus rien.
    branches: ["**"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est déjà installé sur les machines GitHub (ANDROID_HOME) :
      # le plugin Android télécharge lui-même les composants manquants.

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"   # version compatible avec le plugin Android 8.7

      - name: Compiler
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ImmoJ.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ImmoJ-apk
          path: android/ImmoJ.apk

      # Copie l'APK sur une branche « apk » (un seul fichier, écrasée à chaque
      # compilation) : téléchargeable directement depuis GitHub, même sur
      # téléphone, sans décompresser d'archive. Voir docs/04-installer-apk.md.
      - name: Publier l'APK sur la branche apk
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/branche-apk && mkdir /tmp/branche-apk && cd /tmp/branche-apk
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/android/ImmoJ.apk" .
          printf '# APK ImmoJ\n\nCompilé depuis `%s` (%s).\n\nTélécharger : cliquer sur ImmoJ.apk puis « Download raw file ».\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" > README.md
          git add . && git commit -q -m "APK compilé depuis $GITHUB_REF_NAME ($GITHUB_SHA)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:apk

      - name: Publier dans Releases (tags v* uniquement)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/ImmoJ.apk
