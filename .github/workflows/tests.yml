# Tests et vérification du style du collecteur, à chaque push.
name: Tests du collecteur

on:
  push:
    paths: ["collecteur/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["collecteur/**"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: collecteur
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collecteur/requirements.txt
      - run: pip install -r requirements.txt
      - name: Style (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q
